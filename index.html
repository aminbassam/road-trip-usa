<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Trip USA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ocean:#bcd6e2; --land1:#f1e3a4; --land2:#ebcfc6; --land3:#cfe2b6; --land4:#dcd2e8;
  --border:#ffffff; --nation:#6f7d85;
  --ink:#1b2422; --ink2:#4c5753; --paper:#fbfaf6; --paper2:#f0eee6; --line:#dcd8cc;
  --i-blue:#1f4f9f; --us-red:#b8402e; --drive:#d2861a; --trip:#c2185b;
  --sign-green:#0a6a3b; --sign-brown:#5f3b22; --sign-blue:#1c4f96;
  --halo:rgba(255,255,255,.9); --label:#24302d; --park:#2f6b35; --mark:#5f3b22;
  --shadow:0 6px 24px rgba(20,30,28,.18);
  font-family:"Overpass","Highway Gothic","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ocean:#0f1d26; --land1:#3a3826; --land2:#3b2f2c; --land3:#2c3828; --land4:#322e3c;
    --border:#121a1f; --nation:#7b8a92;
    --ink:#eef0ea; --ink2:#a9b2ad; --paper:#151b1d; --paper2:#1d2427; --line:#2d3639;
    --i-blue:#6f9cf0; --us-red:#e0705c; --drive:#f0a742; --trip:#f06292;
    --halo:rgba(14,22,26,.88); --label:#e5e9e3; --park:#7cc47f; --mark:#d39a6a;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ocean:#0f1d26; --land1:#3a3826; --land2:#3b2f2c; --land3:#2c3828; --land4:#322e3c;
  --border:#121a1f; --nation:#7b8a92;
  --ink:#eef0ea; --ink2:#a9b2ad; --paper:#151b1d; --paper2:#1d2427; --line:#2d3639;
  --i-blue:#6f9cf0; --us-red:#e0705c; --drive:#f0a742; --trip:#f06292;
  --halo:rgba(14,22,26,.88); --label:#e5e9e3; --park:#7cc47f; --mark:#d39a6a;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sign-blue);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.top,.stage{min-width:0}

/* header */
.top{background:var(--sign-green);color:#fff;padding:8px 10px 0;position:relative;z-index:5}
.toprow{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.brand svg{width:30px;height:30px;display:block}
.brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:.01em;line-height:1;white-space:nowrap}
.searchwrap{position:relative;flex:1 1 auto;min-width:0}
#q{width:100%;border:0;border-radius:8px;padding:9px 12px 7px;font-size:15px;background:rgba(255,255,255,.95);color:#1b2422}
#q::placeholder{color:#6b7570}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);max-height:min(60vh,380px);overflow:auto;z-index:30}
.results button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;border:0;background:none;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--paper2)}
.results small{color:var(--ink2);font-size:12px}
.results .empty{padding:12px 14px;color:var(--ink2);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:5px 11px 3px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:#fff;color:var(--sign-green);border-color:#fff}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;background:currentColor}
.chip[data-layer="interstates"] i{background:#3f73c9;border-radius:2px}
.chip[data-layer="usroutes"] i{background:#d4543f;border-radius:2px;height:4px}
.chip[data-layer="parks"] i{background:#3c8a42}
.chip[data-layer="landmarks"] i{background:#8a5a36;transform:rotate(45deg);border-radius:1px;width:9px;height:9px}
.chip[data-layer="drives"] i{background:#e19527;border-radius:2px;height:4px}
.chip[data-layer="cities"] i{background:#333;width:7px;height:7px}

/* stage */
.stage{position:relative;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:1 1 auto;min-height:0;background:var(--ocean);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.mapctl button{width:40px;height:40px;border-radius:10px;border:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.mapctl button svg{width:20px;height:20px}
.legend-hint{position:absolute;left:10px;bottom:10px;z-index:3;font-size:12px;color:var(--ink2);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:4px 8px 2px;border-radius:6px;pointer-events:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px 7px;border-radius:10px;font-size:14px;max-width:min(92%,420px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;text-align:center}
.toast.show{opacity:1}

/* sheet */
.sheet{flex:0 0 auto;height:46%;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:4;transition:height .25s ease}
.sheet.expanded{height:80%}
.sheet.collapsed{height:94px}
.grip{border:0;background:none;padding:7px 0 3px;cursor:pointer;display:block;width:100%}
.grip span{display:block;margin:0 auto;width:44px;height:5px;border-radius:3px;background:var(--line)}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:8px 4px 8px;font-size:14px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign-green)}
.tab .count{display:inline-block;min-width:20px;padding:1px 6px 0;border-radius:999px;background:var(--trip);color:#fff;font-size:12px;margin-left:4px}
.panes{flex:1 1 auto;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.pane{padding:14px 14px 28px}
.pane[hidden]{display:none}

@media (min-width:900px){
  .stage{flex-direction:row-reverse}
  .sheet,.sheet.expanded,.sheet.collapsed{height:auto;width:400px;border-top:0;border-right:1px solid var(--line);box-shadow:none}
  .grip{display:none}
  .top{padding:10px 16px 0}
  .brand h1{font-size:20px}
  .toprow{gap:16px}
  .searchwrap{max-width:440px}
}

/* sign headers: the one loud thing */
.sign{position:relative;border-radius:10px;padding:13px 16px 11px;color:#fff;box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 5px rgba(255,255,255,.92);background:var(--bg);margin-bottom:12px}
.sign.green{--bg:var(--sign-green)} .sign.brown{--bg:var(--sign-brown)} .sign.blue{--bg:var(--sign-blue)}
.sign h2{margin:0;font-size:24px;line-height:1.08;font-weight:800;padding-right:34px}
.sign .sub{font-size:14px;opacity:.92;margin-top:4px}
.sign .close{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:8px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.svcbar{background:var(--sign-blue);color:#fff;border-radius:8px;padding:8px 12px 6px;font-weight:800;font-size:15px;margin:18px 0 8px;box-shadow:inset 0 0 0 2px var(--sign-blue),inset 0 0 0 3.5px rgba(255,255,255,.9)}
.svcbar small{font-weight:400;opacity:.9;font-size:12.5px;display:block}

.desc{font-size:15px;line-height:1.5;margin:0 0 12px;color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 10px 7px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;cursor:pointer;text-align:center;line-height:1.15}
.btn:hover{background:var(--paper2)}
.btn.call{background:var(--sign-green);border-color:var(--sign-green);color:#fff}
.btn.trip{background:var(--trip);border-color:var(--trip);color:#fff}
.btn.trip.added{background:transparent;color:var(--trip)}
.btn.full{grid-column:1/-1}
.btn svg{width:17px;height:17px;flex:0 0 auto}

.h3{font-size:15px;font-weight:800;margin:20px 0 8px}
.camps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.camps li+li{border-top:1px solid var(--line)}
.camps a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px 9px;text-decoration:none;font-size:15px}
.camps a:hover{background:var(--paper2)}
.camps a span{color:var(--ink2);font-size:12.5px}
.note{font-size:13.5px;color:var(--ink2);line-height:1.45;margin:8px 0 0}
.book{margin-top:8px;font-size:14px;line-height:1.45}
.book a{font-weight:700}

.svcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.svc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;border-radius:10px;border:1.5px solid var(--line);text-decoration:none;font-size:12.5px;font-weight:600;text-align:center;line-height:1.15}
.svc:hover{background:var(--paper2);border-color:var(--sign-blue)}
.svc b{font-size:20px;line-height:1}

.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:11px 2px 9px;text-align:left;cursor:pointer;font-size:15px}
.list button:hover{background:var(--paper2)}
.list small{color:var(--ink2);font-size:12.5px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;flex:0 0 auto;vertical-align:1px}
.dot.park{background:var(--park)} .dot.mark{background:var(--mark);border-radius:2px;transform:rotate(45deg)} .dot.drive{background:var(--drive);border-radius:2px;height:4px;width:14px}
.intro{font-size:15px;line-height:1.5;color:var(--ink2);margin:0 0 4px}
.coords{font-size:12.5px;opacity:.85}

/* trip */
.stops{list-style:none;margin:0;padding:0;counter-reset:s}
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stop .num{width:28px;height:28px;border-radius:50%;background:var(--trip);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;padding-top:2px}
.stop .nm{font-weight:700;font-size:15px;line-height:1.2;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.stop .leg{font-size:12.5px;color:var(--ink2);margin-top:2px}
.stop .ctl{display:flex;gap:4px}
.stop .ctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px;display:grid;place-items:center}
.stop .ctl button:disabled{opacity:.3;cursor:default}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;font-weight:800;font-size:16px}
.total small{font-weight:400;color:var(--ink2);font-size:12.5px}
.legs{display:grid;gap:8px;margin-top:10px}
.empty-trip{text-align:left;font-size:15px;line-height:1.5;color:var(--ink2);padding:6px 0}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}

/* help */
.calls{list-style:none;margin:0;padding:0}
.calls li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.calls b{display:block;font-size:15px}
.calls span{font-size:13px;color:var(--ink2)}
.calls a{flex:0 0 auto;text-decoration:none;font-weight:800;background:var(--sign-green);color:#fff;border-radius:10px;padding:10px 12px 8px;font-size:14px;min-width:118px;text-align:center}
.calls a.red{background:#b3261e}
.tips{padding-left:18px;margin:6px 0 0;font-size:14.5px;line-height:1.5}
.tips li{margin-bottom:8px}
.fine{font-size:12.5px;color:var(--ink2);line-height:1.45;margin-top:16px}

/* map svg */
.st{stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
.nation{fill:none;stroke:var(--nation);stroke-width:1;vector-effect:non-scaling-stroke}
.rd{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rd.i{stroke:var(--i-blue);stroke-width:1.6;opacity:.85}
.rd.u{stroke:var(--us-red);stroke-width:.8;opacity:.7}
.zr .rd.i{stroke-width:2.4}
.zr .rd.u{stroke-width:1.2}
.dr{fill:none;stroke:var(--drive);stroke-width:3.4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 4;pointer-events:none}
.dr.sel{stroke-width:5.5;stroke-dasharray:none}
.drhit{fill:none;stroke:transparent;stroke-width:18;vector-effect:non-scaling-stroke;cursor:pointer}
.tripline{fill:none;stroke:var(--trip);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
.mk{cursor:pointer}
.mk text,.lbl{font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;fill:var(--label);pointer-events:none}
.mk .hit{fill:transparent}
.mk.park .shape{fill:var(--park);stroke:#fff;stroke-width:1.5}
.mk.mark .shape{fill:var(--mark);stroke:#fff;stroke-width:1.3}
.mk.city .shape{fill:var(--label);stroke:var(--halo);stroke-width:1.2}
.mk.sel .shape{stroke:var(--trip);stroke-width:3}
.mk .plabel{display:none;font-size:11px}
.mk.city .clabel{font-size:10px;font-weight:600;display:none}
.zc1 .mk.city.t1 .clabel{display:block}
.zc2 .mk.city.t2 .clabel{display:block}
.zc3 .mk.city.t3 .clabel{display:block}
.zp .mk.park .plabel{display:block}
.zl .mk.mark .plabel{display:block}
.mk.sel .plabel{display:block}
.shield{pointer-events:none;display:none}
.zp .shield{display:block}
.shield .sb{fill:#1f4f9f;stroke:#fff;stroke-width:1}
.shield .sr{fill:#c0392b}
.shield text{fill:#fff;font-weight:800;font-size:7.5px;text-anchor:middle}
.pin .p{fill:var(--trip);stroke:#fff;stroke-width:1.5}
.tpin circle{fill:var(--trip);stroke:#fff;stroke-width:1.5}
.tpin text{fill:#fff;font-weight:800;font-size:10px;text-anchor:middle}
.hide-parks .mk.park,.hide-landmarks .mk.mark,.hide-cities .mk.city,.hide-interstates .gi,.hide-interstates .shield,.hide-usroutes .gu,.hide-drives .gd{display:none}

@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 6 Q6 3 9 3 L31 3 Q34 3 34 6 L34 20 Q34 31 20 37 Q6 31 6 20Z" fill="#fff"/><path d="M8 7 Q8 5 10 5 L30 5 Q32 5 32 7 L32 12 L8 12Z" fill="#c0392b"/><path d="M8 13 L32 13 L32 20 Q32 29 20 34.5 Q8 29 8 20Z" fill="#1f4f9f"/><text x="20" y="27" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Overpass,Arial,sans-serif">USA</text></svg>
        <h1>Road Trip USA</h1>
      </div>
      <div class="searchwrap">
        <input id="q" type="search" placeholder="Search parks, cities, states" autocomplete="off" aria-label="Search the map" aria-controls="results">
        <div id="results" class="results" hidden></div>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Map layers">
      <button class="chip" data-layer="parks" aria-pressed="true"><i></i>National parks</button>
      <button class="chip" data-layer="landmarks" aria-pressed="true"><i></i>Landmarks</button>
      <button class="chip" data-layer="drives" aria-pressed="true"><i></i>Scenic drives</button>
      <button class="chip" data-layer="interstates" aria-pressed="true"><i></i>Interstates</button>
      <button class="chip" data-layer="usroutes" aria-pressed="false"><i></i>US highways</button>
      <button class="chip" data-layer="cities" aria-pressed="true"><i></i>Cities</button>
    </div>
  </header>
  <main class="stage">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the United States with parks, landmarks, roads and scenic drives">
        <g id="zg"></g>
      </svg>
      <div class="mapctl">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">&minus;</button>
        <button id="zreset" aria-label="Show whole country"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button id="locate" aria-label="Find my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </div>
      <div class="legend-hint" id="hint">Pinch or scroll to zoom. Tap anywhere for services there.</div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <section class="sheet" id="sheet" aria-label="Details">
      <button class="grip" id="grip" aria-label="Resize panel"><span></span></button>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-explore" aria-selected="true" aria-controls="p-explore">Explore</button>
        <button class="tab" role="tab" id="t-trip" aria-selected="false" aria-controls="p-trip">My trip<span class="count" id="tripcount" hidden>0</span></button>
        <button class="tab" role="tab" id="t-help" aria-selected="false" aria-controls="p-help">Help &amp; calls</button>
      </div>
      <div class="panes" id="panes">
        <div class="pane" id="p-explore" role="tabpanel"></div>
        <div class="pane" id="p-trip" role="tabpanel" hidden></div>
        <div class="pane" id="p-help" role="tabpanel" hidden></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  ['⛽','Gas','gas station'],['🔌','EV charging','EV charging station'],['🚽','Dump stations','RV dump station'],
  ['🚿','Showers','truck stop showers'],['🧺','Laundromats','laundromat'],['🛒','Groceries','grocery store'],
  ['🔥','Propane','propane refill'],['🔧','Auto repair','auto repair'],['🏥','Hospital','hospital']
];
const BOOK = {
  rec:'Reserve on <a href="https://www.recreation.gov" target="_blank" rel="noopener">Recreation.gov</a> or call <a href="'+tel('877-444-6777')+'">1-877-444-6777</a>. Popular sites open about 6 months ahead and go fast.',
  rc:'These campgrounds are run with California State Parks. Reserve at <a href="https://www.reservecalifornia.com" target="_blank" rel="noopener">ReserveCalifornia</a> or call <a href="'+tel('800-444-7275')+'">1-800-444-7275</a>.',
  ynp:'Madison, Canyon, Grant Village, Bridge Bay and Fishing Bridge RV: Yellowstone National Park Lodges, <a href="'+tel('307-344-7311')+'">307-344-7311</a>. The other campgrounds: Recreation.gov, <a href="'+tel('877-444-6777')+'">1-877-444-6777</a>.',
  conc:'Booked through the park\u2019s concessioner. The park website links to it.',
  fcfs:'First-come, first-served. Arrive early, especially on weekends.',
  site:'Booking varies by campground. The park website has current details.',
  none:''
};

/* ---------- data prep ---------- */
PARKS.forEach(p => { p.type = 'park'; p.full = p.n + ' National Park'; });
LANDMARKS.forEach(p => { p.type = 'mark'; p.full = p.n; });
const CITY = CITIES.map(([n,st,lat,lon,t]) => ({id:'c-'+n.toLowerCase().replace(/\W+/g,'-')+'-'+st, type:'city', n, st, lat, lon, t, full:n+', '+st}));
DRIVES.forEach(d => {
  d.type = 'drive';
  d.stops = d.pts.filter(p => p[2]).map(p => ({lat:p[0], lon:p[1], q:p[2]}));
  d.lat = d.stops[0].lat; d.lon = d.stops[0].lon;
});
const BYID = {};
[...PARKS, ...LANDMARKS, ...CITY, ...DRIVES].forEach(x => BYID[x.id] = x);

/* ---------- map ---------- */
const W = 975, H = 610;
const projection = d3.geoAlbersUsa().scale(1300).translate([W/2, H/2]);
const path = d3.geoPath(projection);
const svg = d3.select('#map');
const zg = d3.select('#zg');
const states = topojson.feature(STATES_TOPO, STATES_TOPO.objects.states).features.filter(f => +f.id <= 56);
const STATE_NAME = {};
states.forEach(f => STATE_NAME[f.properties.name] = f);

// greedy 4-colouring so neighbours differ, like a paper atlas
const geoms = STATES_TOPO.objects.states.geometries;
const nb = topojson.neighbors(geoms);
const color = new Array(geoms.length).fill(-1);
geoms.map((g,i)=>i).sort((a,b)=>nb[b].length-nb[a].length).forEach(i => {
  const used = new Set(nb[i].map(j => color[j]));
  let c = 0; while (used.has(c)) c++;
  color[i] = c % 4;
});
const colorById = {};
geoms.forEach((g,i) => colorById[g.id] = color[i]);

zg.append('rect').attr('x',-3000).attr('y',-3000).attr('width',7000).attr('height',7000).attr('fill','transparent');
zg.append('g').selectAll('path').data(states).join('path')
  .attr('class','st').attr('d', path)
  .attr('fill', d => 'var(--land' + ((colorById[d.id] || 0) + 1) + ')');
zg.append('path').attr('class','nation')
  .attr('d', path(topojson.mesh(STATES_TOPO, STATES_TOPO.objects.nation)));

const toGeo = c => ({type:'MultiLineString', coordinates:c});
const gu = zg.append('g').attr('class','gu');
gu.selectAll('path').data(ROADS.u).join('path').attr('class','rd u').attr('d', d => path(toGeo(d.c)));
const gi = zg.append('g').attr('class','gi');
gi.selectAll('path').data(ROADS.i).join('path').attr('class','rd i').attr('d', d => path(toGeo(d.c)));

// scenic drives
const gd = zg.append('g').attr('class','gd');
const driveLine = d => path({type:'LineString', coordinates:d.pts.map(p => [p[1], p[0]])});
gd.selectAll('path.dr').data(DRIVES).join('path').attr('class','dr').attr('d', driveLine);
gd.selectAll('path.drhit').data(DRIVES).join('path').attr('class','drhit').attr('d', driveLine)
  .on('click', (e, d) => { e.stopPropagation(); select(d, {zoom:false}); });

// trip line
const tripLine = zg.append('path').attr('class','tripline');

// interstate shields along major routes
const shields = [];
ROADS.i.forEach(r => {
  if (!/^\d{1,2}$/.test(r.n)) return;
  r.c.forEach(line => {
    const pts = line.map(c => projection(c)).filter(Boolean);
    let acc = 0, next = 55;
    for (let k = 1; k < pts.length; k++) {
      acc += Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]);
      if (acc >= next) { shields.push({x:pts[k][0], y:pts[k][1], n:r.n}); next += 150; }
    }
  });
});
const gs = zg.append('g');
const shieldSel = gs.selectAll('g').data(shields).join('g').attr('class','shield');
shieldSel.append('path').attr('class','sb').attr('d','M-8,-6.5 Q-8,-8 -6.5,-8 L6.5,-8 Q8,-8 8,-6.5 L8,0 Q8,6 0,9 Q-8,6 -8,0 Z');
shieldSel.append('path').attr('class','sr').attr('d','M-7.2,-6.4 Q-7.2,-7.2 -6.4,-7.2 L6.4,-7.2 Q7.2,-7.2 7.2,-6.4 L7.2,-4 L-7.2,-4 Z');
shieldSel.append('text').attr('y', 3.6).text(d => d.n);

// markers
const gm = zg.append('g');
function placeable(d){ const p = projection([d.lon, d.lat]); if (p) { d.x = p[0]; d.y = p[1]; } return !!p; }
const cities = CITY.filter(placeable), parks = PARKS.filter(placeable), marks = LANDMARKS.filter(placeable);
DRIVES.forEach(d => placeable(d));

const citySel = gm.append('g').selectAll('g').data(cities).join('g')
  .attr('class', d => 'mk city t' + d.t);
citySel.append('circle').attr('class','hit').attr('r', 12);
citySel.append('circle').attr('class','shape').attr('r', 2.6);
citySel.append('text').attr('class','clabel').attr('x', 5).attr('y', 3.5).text(d => d.n);

const markSel = gm.append('g').selectAll('g').data(marks).join('g').attr('class','mk mark');
markSel.append('circle').attr('class','hit').attr('r', 15);
markSel.append('rect').attr('class','shape').attr('x',-4).attr('y',-4).attr('width',8).attr('height',8).attr('transform','rotate(45)');
markSel.append('text').attr('class','plabel').attr('x', 8).attr('y', 4).text(d => d.n);

const parkSel = gm.append('g').selectAll('g').data(parks).join('g').attr('class','mk park');
parkSel.append('circle').attr('class','hit').attr('r', 16);
parkSel.append('path').attr('class','shape').attr('d','M0,-7 L6.5,5 L-6.5,5 Z');
parkSel.append('text').attr('class','plabel').attr('x', 8.5).attr('y', 4).text(d => d.n);

const allMk = gm.selectAll('.mk');
allMk.on('click', (e, d) => { e.stopPropagation(); select(d, {zoom:false}); });

// pins (selection + trip numbers)
const gp = zg.append('g');
const selPin = gp.append('g').attr('class','pin').style('display','none');
selPin.append('path').attr('class','p').attr('d','M0,0 C-2,-6 -8,-9 -8,-15 A8,8 0 1 1 8,-15 C8,-9 2,-6 0,0Z');
selPin.append('circle').attr('cx',0).attr('cy',-15).attr('r',3).attr('fill','#fff');
const gtrip = gp.append('g');

/* ---------- zoom ---------- */
// K = zoom factor, SS = screen pixels per map unit at K=1, Z = SS*K = on-screen scale
let K = 1, SS = 1, Z = 1;
const mkScale = () => Math.max(0.78, Math.min(1.15, Math.pow(Z, 0.25))) / Z;
function applyScale(){
  Z = SS * K;
  const s = mkScale();
  const tr = d => 'translate(' + d.x + ',' + d.y + ') scale(' + s + ')';
  allMk.attr('transform', tr);
  shieldSel.attr('transform', tr);
  const sd = selPin.datum();
  if (sd) selPin.attr('transform', tr(sd));
  gtrip.selectAll('g').attr('transform', tr);
  const cl = svg.node().classList;
  cl.toggle('zc1', Z >= 0.9); cl.toggle('zc2', Z >= 1.9); cl.toggle('zc3', Z >= 3.4);
  cl.toggle('zp', Z >= 2.3); cl.toggle('zl', Z >= 3.8); cl.toggle('zr', Z >= 3);
}
const zoom = d3.zoom().scaleExtent([0.8, 80]).clickDistance(4)
  .translateExtent([[-260,-360],[W+260,H+360]])
  .on('zoom', e => { K = e.transform.k; zg.attr('transform', e.transform); applyScale(); });
svg.call(zoom);

function measure(){
  const r = svg.node().getBoundingClientRect();
  SS = Math.min(r.width / W, r.height / H) || 1;
  applyScale();
}
if (window.ResizeObserver) new ResizeObserver(measure).observe(document.getElementById('mapwrap'));
window.addEventListener('resize', measure);

function viewSize(){
  const r = svg.node().getBoundingClientRect();
  return [r.width / SS, r.height / SS];
}
function zoomTo(x, y, k, dur){
  const t = d3.zoomIdentity.translate(W/2, H/2).scale(k).translate(-x, -y);
  svg.transition().duration(dur == null ? 650 : dur).call(zoom.transform, t);
}
const kForZ = z => z / SS;
function zoomBounds(b, maxK){
  const [vw, vh] = viewSize();
  const dx = Math.max(1, b[1][0]-b[0][0]), dy = Math.max(1, b[1][1]-b[0][1]);
  const k = Math.max(1, Math.min(maxK || 40, 0.82 / Math.max(dx / vw, dy / vh)));
  zoomTo((b[0][0]+b[1][0])/2, (b[0][1]+b[1][1])/2, k);
}
function homeView(){ zoomTo(W/2, H/2, 1, 500); }
$('#zin').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.8);
$('#zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1/1.8);
$('#zreset').onclick = homeView;

// tap on empty map = services around that spot
svg.on('click', e => {
  if (e.defaultPrevented) return;
  const [mx, my] = d3.pointer(e, zg.node());
  const ll = projection.invert([mx, my]);
  if (!ll || !isFinite(ll[0])) return;
  const st = states.find(f => d3.geoContains(f, ll));
  if (!st) { toast('That spot is outside the US map.'); return; }
  selectSpot(ll[1], ll[0], st.properties.name);
});

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- sheet & tabs ---------- */
const sheet = $('#sheet');
$('#grip').onclick = () => {
  if (sheet.classList.contains('collapsed')) sheet.classList.remove('collapsed');
  else if (sheet.classList.contains('expanded')) { sheet.classList.remove('expanded'); sheet.classList.add('collapsed'); }
  else sheet.classList.add('expanded');
};
function openSheet(){ sheet.classList.remove('collapsed'); }
const tabs = ['explore','trip','help'];
function showTab(name){
  tabs.forEach(t => {
    $('#t-' + t).setAttribute('aria-selected', t === name);
    $('#p-' + t).hidden = t !== name;
  });
  $('#panes').scrollTop = 0;
  openSheet();
}
tabs.forEach(t => $('#t-' + t).onclick = () => showTab(t));

/* ---------- trip state ---------- */
const KEY = 'rtusa-trip-v1';
let trip = [];
try { trip = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(trip)) trip = []; } catch (e) { trip = []; }
function saveTrip(){ try { localStorage.setItem(KEY, JSON.stringify(trip)); } catch (e) {} }
const inTrip = id => trip.some(s => s.id === id);
function stopFrom(d){
  if (d.type === 'spot') return {id:d.id, name:d.label, q:d.lat.toFixed(5)+','+d.lon.toFixed(5), lat:d.lat, lon:d.lon};
  if (d.type === 'park') return {id:d.id, name:d.full, q:d.full + ', ' + d.st, lat:d.lat, lon:d.lon};
  if (d.type === 'mark') return {id:d.id, name:d.n, q:d.n + ', ' + d.st, lat:d.lat, lon:d.lon};
  return {id:d.id, name:d.full, q:d.full, lat:d.lat, lon:d.lon};
}
function toggleTrip(d){
  if (inTrip(d.id)) { trip = trip.filter(s => s.id !== d.id); toast('Removed from your trip.'); }
  else { trip.push(stopFrom(d)); toast('Added as stop ' + trip.length + '.'); }
  saveTrip(); renderTrip(); drawTrip();
}
function addDrive(d){
  let n = 0;
  d.stops.forEach((s, i) => {
    const id = d.id + '-' + i;
    if (!inTrip(id)) { trip.push({id, name:s.q, q:s.q, lat:s.lat, lon:s.lon}); n++; }
  });
  saveTrip(); renderTrip(); drawTrip();
  toast(n ? 'Added ' + n + ' stops along ' + d.n + '.' : 'Those stops are already in your trip.');
}
function drawTrip(){
  const pts = trip.map(s => { const p = projection([s.lon, s.lat]); return p ? {x:p[0], y:p[1], s} : null; }).filter(Boolean);
  tripLine.attr('d', trip.length > 1 ? path({type:'LineString', coordinates:trip.map(s => [s.lon, s.lat])}) : null);
  const g = gtrip.selectAll('g').data(pts, (d,i) => d.s.id + i).join(enter => {
    const e = enter.append('g').attr('class','tpin');
    e.append('circle').attr('r', 8.5);
    e.append('text').attr('y', 3.6);
    return e;
  });
  g.select('text').text((d,i) => i + 1);
  const s = mkScale();
  g.attr('transform', d => 'translate(' + d.x + ',' + d.y + ') scale(' + s + ')');
  const c = $('#tripcount'); c.hidden = !trip.length; c.textContent = trip.length;
}

/* ---------- explore pane ---------- */
let current = null;
const pane = $('#p-explore');

function servicesHTML(lat, lon, place){
  const sub = lat == null ? 'Opens Google Maps near your current location' : 'Opens Google Maps around ' + esc(place);
  return '<div class="svcbar">Services ' + (lat == null ? 'near me' : 'near here') + '<small>' + sub + ', with phone numbers and hours</small></div>' +
    '<div class="svcgrid">' + SERVICES.map(s =>
      '<a class="svc" target="_blank" rel="noopener" href="' + gSearchNear(s[2], lat, lon) + '"><b aria-hidden="true">' + s[0] + '</b>' + s[1] + '</a>'
    ).join('') + '</div>';
}
function nearbyHTML(d){
  const pool = [...PARKS, ...LANDMARKS].filter(x => x.id !== d.id);
  const near = pool.map(x => ({x, m: roadMi(d, x)})).filter(o => o.m < 360).sort((a,b) => a.m - b.m).slice(0, 6);
  if (!near.length) return '';
  return '<div class="h3">Also within a day\u2019s drive</div><ul class="list">' + near.map(o =>
    '<li><button data-go="' + o.x.id + '"><span><span class="dot ' + o.x.type + '"></span>' + esc(o.x.type === 'park' ? o.x.full : o.x.n) + '</span><small>\u2248 ' + fmtMi(o.m) + ' mi, ' + fmtHrs(o.m) + '</small></button></li>'
  ).join('') + '</ul>';
}
function tripBtn(d){
  const on = inTrip(d.id);
  return '<button class="btn trip' + (on ? ' added' : '') + '" data-trip="' + d.id + '">' + (on ? ICON.check + 'In your trip' : ICON.plus + 'Add to trip') + '</button>';
}

function renderHome(){
  current = null;
  selPin.datum(null).style('display','none');
  allMk.classed('sel', false);
  gd.selectAll('path.dr').classed('sel', false);
  const parksSorted = [...PARKS].sort((a,b) => a.n.localeCompare(b.n));
  pane.innerHTML =
    '<p class="intro">Tap a park, landmark or orange scenic drive for details and phone numbers. Tap anywhere else on the map to find campgrounds, gas and other services at that spot.</p>' +
    servicesHTML(null, null) +
    '<div class="h3">Scenic drives</div><ul class="list">' + DRIVES.map(d =>
      '<li><button data-go="' + d.id + '"><span><span class="dot drive"></span>' + esc(d.n) + '</span><small>' + esc(d.len.replace('About ','\u2248 ')) + '</small></button></li>').join('') + '</ul>' +
    '<div class="h3">National parks you can drive to</div><ul class="list">' + parksSorted.map(p =>
      '<li><button data-go="' + p.id + '"><span><span class="dot park"></span>' + esc(p.n) + '</span><small>' + esc(p.st) + '</small></button></li>').join('') + '</ul>';
}

function renderPark(p){
  const isPark = p.type === 'park';
  const sub = (isPark ? 'National park in ' : '') + p.s;
  let h = '<div class="sign brown"><h2>' + esc(isPark ? p.full : p.n) + '</h2><div class="sub">' + esc(sub) + '</div><button class="close" data-home aria-label="Close">\u00d7</button></div>';
  h += '<p class="desc">' + esc(p.d) + '</p><div class="actions">';
  if (p.ph) h += '<a class="btn call full" href="' + tel(p.ph) + '">' + ICON.phone + 'Call ' + esc(p.ph) + '</a>';
  else h += '<a class="btn call full" target="_blank" rel="noopener" href="' + gPlace(p.n + ', ' + p.st) + '">' + ICON.phone + 'Find phone and hours</a>';
  h += '<a class="btn" target="_blank" rel="noopener" href="' + gDir((isPark ? p.full : p.n) + ', ' + p.st) + '">' + ICON.dir + 'Directions</a>';
  h += tripBtn(p);
  if (p.code) h += '<a class="btn" target="_blank" rel="noopener" href="' + npsUrl(p.code) + '">' + ICON.web + 'Alerts and info</a>';
  else h += '<a class="btn" target="_blank" rel="noopener" href="' + gPlace(p.n + ', ' + p.st) + '">' + ICON.map + 'Google Maps</a>';
  h += '<a class="btn" target="_blank" rel="noopener" href="' + weather(p.lat, p.lon) + '">' + ICON.sun + 'Weather</a>';
  h += '</div>';
  if (isPark) {
    h += '<div class="h3">Camping in the park</div>';
    if (p.camps.length) {
      h += '<ul class="camps">' + p.camps.map(c =>
        '<li><a target="_blank" rel="noopener" href="' + gPlace(c + ' campground, ' + p.full) + '">' + esc(c) + '<span>Map</span></a></li>').join('') + '</ul>';
    }
    if (p.cn) h += '<p class="note">' + esc(p.cn) + '</p>';
    if (BOOK[p.book]) h += '<p class="book">' + BOOK[p.book] + '</p>';
  }
  h += servicesHTML(p.lat, p.lon, isPark ? p.full : p.n);
  h += nearbyHTML(p);
  h += '<p class="fine">Park phone lines are staffed during business hours and can be busy in summer. Check alerts before you go: roads, campgrounds and entry rules change by season.</p>';
  pane.innerHTML = h;
}

function renderCity(c){
  const st = Object.values(STATE_NAME).find(f => d3.geoContains(f, [c.lon, c.lat]));
  let h = '<div class="sign green"><h2>' + esc(c.n) + '</h2><div class="sub">' + esc(st ? st.properties.name : c.st) + '</div><button class="close" data-home aria-label="Close">\u00d7</button></div>';
  h += '<div class="actions"><a class="btn" target="_blank" rel="noopener" href="' + gDir(c.full) + '">' + ICON.dir + 'Directions</a>' + tripBtn(c) +
       '<a class="btn" target="_blank" rel="noopener" href="' + weather(c.lat, c.lon) + '">' + ICON.sun + 'Weather</a>' +
       '<a class="btn" href="tel:511">' + ICON.phone + 'Road info: 511</a></div>';
  h += servicesHTML(c.lat, c.lon, c.full);
  h += nearbyHTML(c);
  pane.innerHTML = h;
}

function renderSpot(s){
  let h = '<div class="sign green"><h2>' + esc(s.label) + '</h2><div class="sub">' + esc(s.state) + ' <span class="coords">(' + s.lat.toFixed(3) + ', ' + s.lon.toFixed(3) + ')</span></div><button class="close" data-home aria-label="Close">\u00d7</button></div>';
  h += '<div class="actions"><a class="btn" target="_blank" rel="noopener" href="' + gDir(s.lat.toFixed(5) + ',' + s.lon.toFixed(5)) + '">' + ICON.dir + 'Directions</a>' + tripBtn(s) +
       '<a class="btn" target="_blank" rel="noopener" href="' + weather(s.lat, s.lon) + '">' + ICON.sun + 'Weather</a>' +
       '<a class="btn" href="tel:511">' + ICON.phone + 'Road info: 511</a>' +
       '<a class="btn full" target="_blank" rel="noopener" href="' + gSearchNear('state park', s.lat, s.lon) + '">' + ICON.map + 'State parks around here</a></div>';
  h += servicesHTML(s.lat, s.lon, 'this spot');
  h += nearbyHTML(s);
  pane.innerHTML = h;
}

function renderDrive(d){
  let h = '<div class="sign brown"><h2>' + esc(d.n) + '</h2><div class="sub">Scenic drive, ' + esc(d.len.toLowerCase()) + '</div><button class="close" data-home aria-label="Close">\u00d7</button></div>';
  h += '<p class="desc">' + esc(d.d) + '</p><p class="note"><b>When to go:</b> ' + esc(d.season) + '</p>';
  h += '<div class="actions" style="margin-top:12px"><button class="btn trip full" data-addrive="' + d.id + '">' + ICON.plus + 'Add all ' + d.stops.length + ' stops to my trip</button></div>';
  h += '<div class="h3">Drive it in Google Maps</div><div class="legs">' + legLinks(d.stops.map(s => s.q), d.stops.map(s => s.q)) + '</div>';
  h += '<div class="h3">Stops along the way</div><ul class="list">' + d.stops.map((s, i) => {
    const m = i ? roadMi(d.stops[i-1], s) : 0;
    return '<li><button data-stopzoom="' + s.lat + ',' + s.lon + '"><span>' + esc(s.q) + '</span><small>' + (i ? '\u2248 ' + fmtMi(m) + ' mi from last' : 'Start') + '</small></button></li>';
  }).join('') + '</ul>';
  const mid = d.stops[Math.floor(d.stops.length/2)];
  h += servicesHTML(mid.lat, mid.lon, mid.q);
  pane.innerHTML = h;
}

// Google Maps keeps only 3 waypoints in mobile browsers, so split routes into 5-stop legs
function legLinks(queries, names){
  if (queries.length < 2) return '';
  const out = []; let i = 0, leg = 1;
  while (i < queries.length - 1) {
    const end = Math.min(i + 4, queries.length - 1);
    const label = queries.length <= 5 ? 'Open full route' : 'Leg ' + leg + ': ' + short(names[i]) + ' to ' + short(names[end]);
    out.push('<a class="btn full" target="_blank" rel="noopener" href="' + gRoute(queries.slice(i, end + 1)) + '">' + ICON.dir + esc(label) + '</a>');
    i = end; leg++;
  }
  return out.join('');
}
const short = s => String(s).split(',')[0].replace(/ National Park$/,'');

function select(d, opt){
  opt = opt || {};
  current = d;
  allMk.classed('sel', x => x.id === d.id);
  gd.selectAll('path.dr').classed('sel', x => x.id === d.id);
  if (d.type === 'spot') {
    selPin.datum(d).style('display', null)
      .attr('transform', 'translate(' + d.x + ',' + d.y + ') scale(' + mkScale() + ')');
  } else selPin.datum(null).style('display','none');
  renderCurrent();
  showTab('explore');
  if (opt.zoom) {
    if (d.type === 'drive') zoomBounds(path.bounds({type:'LineString', coordinates:d.pts.map(p => [p[1], p[0]])}), 12);
    else if (d.x != null) zoomTo(d.x, d.y, Math.max(K, kForZ(d.type === 'city' ? 3.6 : 4.2)));
  }
}

function renderCurrent(){
  const d = current; if (!d) return;
  if (d.type === 'park' || d.type === 'mark') renderPark(d);
  else if (d.type === 'city') renderCity(d);
  else if (d.type === 'drive') renderDrive(d);
  else renderSpot(d);
}
function refreshTripBtns(){
  pane.querySelectorAll('[data-trip]').forEach(x => {
    const d = (current && current.id === x.dataset.trip) ? current : BYID[x.dataset.trip];
    if (d) x.outerHTML = tripBtn(d);
  });
}
function nearestCity(lat, lon){
  let best = null, bm = Infinity;
  CITY.forEach(c => { const m = miles({lat, lon}, c); if (m < bm) { bm = m; best = c; } });
  return {c: best, m: bm};
}
function selectSpot(lat, lon, stateName, label){
  const p = projection([lon, lat]);
  if (!p) { toast('That location is outside the map.'); return; }
  const nc = nearestCity(lat, lon);
  const lbl = label || (nc.m < 12 ? 'In ' + nc.c.n : 'About ' + Math.round(nc.m / 5) * 5 + ' mi from ' + nc.c.n);
  const d = {type:'spot', id:'spot-' + lat.toFixed(3) + '_' + lon.toFixed(3), lat, lon, x:p[0], y:p[1], state: stateName || '', label: lbl};
  select(d);
}

// delegated clicks inside panes
document.getElementById('panes').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-home')) { renderHome(); return; }
  if (b.dataset.go) { const d = BYID[b.dataset.go]; if (d) select(d, {zoom:true}); return; }
  if (b.dataset.trip) {
    const d = (current && current.id === b.dataset.trip) ? current : BYID[b.dataset.trip];
    if (d) { toggleTrip(d); b.outerHTML = tripBtn(d); }
    return;
  }
  if (b.dataset.addrive) { addDrive(BYID[b.dataset.addrive]); showTab('trip'); return; }
  if (b.dataset.stopzoom) { const [la, lo] = b.dataset.stopzoom.split(',').map(Number); const p = projection([lo, la]); if (p) zoomTo(p[0], p[1], Math.max(K, kForZ(4))); return; }
  if (b.dataset.tripgo != null) { const s = trip[+b.dataset.tripgo]; const p = s && projection([s.lon, s.lat]); if (p) zoomTo(p[0], p[1], Math.max(K, kForZ(4))); return; }
  if (b.dataset.up != null) { const i = +b.dataset.up; if (i > 0) { [trip[i-1], trip[i]] = [trip[i], trip[i-1]]; saveTrip(); renderTrip(); drawTrip(); } return; }
  if (b.dataset.down != null) { const i = +b.dataset.down; if (i < trip.length - 1) { [trip[i+1], trip[i]] = [trip[i], trip[i+1]]; saveTrip(); renderTrip(); drawTrip(); } return; }
  if (b.dataset.rm != null) { trip.splice(+b.dataset.rm, 1); saveTrip(); renderTrip(); drawTrip(); refreshTripBtns(); return; }
  if (b.id === 'tripsort') { sortTrip(); return; }
  if (b.id === 'tripclear') {
    if (b.dataset.confirm) { trip = []; saveTrip(); renderTrip(); drawTrip(); refreshTripBtns(); }
    else { b.dataset.confirm = '1'; b.textContent = 'Tap again to clear'; }
    return;
  }
});

/* ---------- trip pane ---------- */
function sortTrip(){
  if (trip.length < 3) return;
  const rest = trip.slice(1), out = [trip[0]];
  while (rest.length) {
    const last = out[out.length-1];
    let bi = 0, bm = Infinity;
    rest.forEach((s, i) => { const m = miles(last, s); if (m < bm) { bm = m; bi = i; } });
    out.push(rest.splice(bi, 1)[0]);
  }
  trip = out; saveTrip(); renderTrip(); drawTrip();
  toast('Stops reordered: each one goes to the nearest next stop.');
}
function renderTrip(){
  const p = $('#p-trip');
  if (!trip.length) {
    p.innerHTML = '<div class="sign green"><h2>My trip</h2><div class="sub">No stops yet</div></div>' +
      '<p class="empty-trip">Open any park, landmark, city or spot on the map and choose Add to trip. Stops are saved on this device, and you can send the whole route to Google Maps.</p>';
    return;
  }
  let total = 0;
  let h = '<div class="sign green"><h2>My trip</h2><div class="sub">' + trip.length + ' stop' + (trip.length > 1 ? 's' : '') + '</div></div><ol class="stops">';
  trip.forEach((s, i) => {
    const m = i ? roadMi(trip[i-1], s) : 0; total += m;
    h += '<li class="stop"><span class="num">' + (i+1) + '</span><div><button class="nm" data-tripgo="' + i + '">' + esc(s.name) + '</button><div class="leg">' +
      (i ? '\u2248 ' + fmtMi(m) + ' mi, ' + fmtHrs(m) + ' from stop ' + i : 'Start') + '</div></div>' +
      '<div class="ctl"><button data-up="' + i + '" aria-label="Move up"' + (i ? '' : ' disabled') + '>\u2191</button>' +
      '<button data-down="' + i + '" aria-label="Move down"' + (i < trip.length-1 ? '' : ' disabled') + '>\u2193</button>' +
      '<button data-rm="' + i + '" aria-label="Remove stop">\u00d7</button></div></li>';
  });
  h += '</ol>';
  if (trip.length > 1) {
    h += '<div class="total"><span>\u2248 ' + fmtMi(total) + ' miles</span><small>about ' + fmtHrs(total) + ' of driving</small></div>';
    h += '<p class="note">Estimates use straight-line distance \u00d7 1.25 at ' + AVG_MPH + ' mph. Google Maps gives the real route.</p>';
    h += '<div class="h3">Open in Google Maps</div><div class="legs">' + legLinks(trip.map(s => s.q), trip.map(s => s.name)) + '</div>';
  }
  h += '<div class="row">' + (trip.length > 2 ? '<button class="btn" id="tripsort">Reorder by nearest</button>' : '') + '<button class="btn" id="tripclear">Clear trip</button></div>';
  p.innerHTML = h;
}

/* ---------- help pane ---------- */
function renderHelp(){
  const rows = [
    ['Emergency','Police, fire, ambulance and park rangers','911',true],
    ['Road conditions','Closures, chain laws and construction in most states','511'],
    ['AAA roadside help','Towing, flat tires, lockouts (members)','800-222-4357'],
    ['Recreation.gov','National park and forest campground bookings','877-444-6777'],
    ['ReserveCalifornia','California state park campgrounds','800-444-7275'],
    ['Yellowstone lodging and camping','Madison, Canyon, Grant, Bridge Bay, Fishing Bridge','307-344-7311'],
    ['Poison Control','Bites, stings, plants and chemicals, 24/7','800-222-1222']
  ];
  $('#p-help').innerHTML = '<div class="sign green"><h2>Help and calls</h2><div class="sub">Numbers worth having on the road</div></div>' +
    '<ul class="calls">' + rows.map(r =>
      '<li><div><b>' + r[0] + '</b><span>' + r[1] + '</span></div><a class="' + (r[3] ? 'red' : '') + '" href="' + (r[2].length <= 3 ? 'tel:' + r[2] : tel(r[2])) + '">' + (r[2].length <= 3 ? 'Call ' + r[2] : r[2]) + '</a></li>'
    ).join('') + '</ul>' +
    servicesHTML(null, null) +
    '<div class="h3">Road tips</div><ul class="tips">' +
    '<li>Download offline maps in Google Maps before entering parks and deserts. Cell service often drops out.</li>' +
    '<li>Fill up before remote stretches like Nevada\u2019s US-50, Big Bend and Death Valley, where gas can be 100+ miles apart.</li>' +
    '<li>An America the Beautiful pass covers entrance fees at every national park for a year.</li>' +
    '<li>Mountain passes such as Going-to-the-Sun, Beartooth and Trail Ridge close for snow, usually from mid-October to late spring.</li>' +
    '</ul><p class="fine">Phone numbers are official main lines for each park or service. Hours, closures and booking rules change, so confirm with the park before you rely on a plan. If calls or links don\u2019t open from inside this page, long-press the number to copy it.</p>';
}

/* ---------- search ---------- */
const INDEX = [
  ...PARKS.map(p => ({d:p, t:p.full, s:p.s, k:(p.full + ' ' + p.s + ' ' + p.st).toLowerCase()})),
  ...LANDMARKS.map(p => ({d:p, t:p.n, s:'Landmark, ' + p.s, k:(p.n + ' ' + p.s + ' ' + p.st).toLowerCase()})),
  ...DRIVES.map(p => ({d:p, t:p.n, s:'Scenic drive', k:(p.n + ' scenic drive ' + p.stops.map(x => x.q).join(' ')).toLowerCase()})),
  ...CITY.map(c => ({d:c, t:c.full, s:'City', k:(c.n + ' ' + c.st).toLowerCase()})),
  ...states.map(f => ({d:{type:'state', f}, t:f.properties.name, s:'State', k:f.properties.name.toLowerCase()}))
];
const q = $('#q'), res = $('#results');
function runSearch(){
  const v = q.value.trim().toLowerCase();
  if (!v) { res.hidden = true; res.innerHTML = ''; return; }
  const hits = INDEX.map(x => { const tl = x.t.toLowerCase(); return {x, i: x.k.indexOf(v), ex: +(tl === v), st: +tl.startsWith(v)}; })
    .filter(o => o.i >= 0)
    .sort((a,b) => (b.ex - a.ex) || (b.st - a.st) || (a.i - b.i) || (a.x.t.length - b.x.t.length)).slice(0, 9);
  res.innerHTML = hits.length ? hits.map((o, n) => '<button data-r="' + n + '">' + esc(o.x.t) + '<small>' + esc(o.x.s) + '</small></button>').join('')
    : '<div class="empty">No match. Try a park, a city or a state name.</div>';
  res._hits = hits;
  res.hidden = false;
}
q.addEventListener('input', runSearch);
q.addEventListener('focus', runSearch);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && res._hits && res._hits[0]) { pick(res._hits[0].x.d); }
  if (e.key === 'Escape') { res.hidden = true; q.blur(); }
});
res.addEventListener('click', e => {
  const b = e.target.closest('button[data-r]');
  if (b) pick(res._hits[+b.dataset.r].x.d);
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.searchwrap')) res.hidden = true; });
function pick(d){
  res.hidden = true; q.value = ''; q.blur();
  if (d.type === 'state') {
    zoomBounds(path.bounds(d.f), 12);
    const c = d3.geoCentroid(d.f);
    selectSpot(c[1], c[0], d.f.properties.name, d.f.properties.name);
  } else select(d, {zoom:true});
}

/* ---------- layers ---------- */
document.querySelectorAll('.chip').forEach(ch => {
  const apply = () => svg.node().classList.toggle('hide-' + ch.dataset.layer, ch.getAttribute('aria-pressed') !== 'true');
  apply();
  ch.onclick = () => { ch.setAttribute('aria-pressed', ch.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); apply(); };
});

/* ---------- locate ---------- */
$('#locate').onclick = () => {
  if (!navigator.geolocation) { toast('Location isn\u2019t available here. Tap the map where you are instead.'); return; }
  toast('Finding your location\u2026');
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude:lat, longitude:lon} = pos.coords;
    const st = states.find(f => d3.geoContains(f, [lon, lat]));
    const p = projection([lon, lat]);
    if (!p) { toast('You appear to be outside the map area.'); return; }
    selectSpot(lat, lon, st ? st.properties.name : '', 'You are here');
    zoomTo(p[0], p[1], Math.max(K, kForZ(4.5)));
  }, () => {
    toast('Location is blocked in this view. Tap the map where you are, or use the services near me buttons.');
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
};

/* ---------- start ---------- */
renderHome(); renderTrip(); renderHelp(); drawTrip();
measure();
svg.call(zoom.transform, d3.zoomIdentity);
setTimeout(() => { const h = $('#hint'); if (h) h.style.display = 'none'; }, 9000);
})();
</script>
</body>
